name: ダート種牡馬リーディング自動更新

on:
  schedule:
    # 毎週月曜日 日本時間 9:00（UTC 0:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 手動実行ボタン

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install requests beautifulsoup4 lxml

      - name: スクレイピング実行（ダート種牡馬リーディング）
        run: python scrape_stallion_leading.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stallion_leading.json
          git diff --staged --quiet || git commit -m "自動更新: ダート種牡馬リーディング $(date '+%Y/%m/%d')"
          git pull --rebase origin main
          git push
