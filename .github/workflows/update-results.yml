name: 最新結果を自動更新

on:
  schedule:
    # 平日: 日本時間 9:00, 11:00, 13:00, 15:00, 17:00 に実行（UTC 00:00, 02:00, 04:00, 06:00, 08:00）
    - cron: '0 0 * * 1-5'
    - cron: '0 2 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '0 8 * * 1-5'
    # 土日: 日本時間 9:00〜18:00 の間、10分おきに実行（UTC 0:00〜9:00）
    - cron: '*/10 0-9 * * 0,6'
  workflow_dispatch:  # 手動実行ボタンも有効にする

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install requests beautifulsoup4 lxml

      - name: スクレイピング実行（レース結果）
        run: python scrape_results.py

      - name: スクレイピング実行（最新状況・登録馬名）
        run: python scrape_pogstarion.py

      - name: スクレイピング実行（ニュース）
        run: python scrape_news.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/results.json public/data/upcoming.json public/data/kettonums.json public/data/news.json public/data/updated.json public/data/pogstarion.json public/data/regist2627.json kettonum_cache.json
          git diff --staged --quiet || git commit -m "自動更新: 最新レース結果 $(date '+%Y/%m/%d %H:%M')"
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git push
