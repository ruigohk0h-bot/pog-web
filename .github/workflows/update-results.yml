name: 最新結果を自動更新

on:
  schedule:
    # 毎日 日本時間 17:00 に実行（UTC 08:00）
    - cron: '0 8 * * *'
  workflow_dispatch:  # 手動実行ボタンも有効にする

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install requests beautifulsoup4 lxml

      - name: スクレイピング実行（レース結果）
        run: python scrape_results.py

      - name: スクレイピング実行（ニュース）
        run: python scrape_news.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/results.json public/data/upcoming.json public/data/kettonums.json public/data/news.json public/data/updated.json kettonum_cache.json
          git diff --staged --quiet || git commit -m "自動更新: 最新レース結果 $(date '+%Y/%m/%d %H:%M')"
          git pull --rebase origin main
          git push
