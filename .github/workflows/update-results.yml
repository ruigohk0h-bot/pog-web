name: 最新結果を自動更新

on:
  schedule:
    # 毎日 日本時間 8:00 と 21:00 に実行（UTC 23:00 と 12:00）
    - cron: '0 23 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:  # 手動実行ボタンも有効にする

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install requests beautifulsoup4 lxml

      - name: スクレイピング実行
        run: python scrape_results.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/results.json public/data/upcoming.json kettonum_cache.json
          git diff --staged --quiet || git commit -m "自動更新: 最新レース結果 $(date '+%Y/%m/%d %H:%M')"
          git push
