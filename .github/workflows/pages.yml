name: GitHub Pagesにデプロイ

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["最新結果を自動更新"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存関係インストール
        run: npm ci

      - name: ビルド
        run: npm run build

      - name: GitHub Pages 設定
        uses: actions/configure-pages@v4

      - name: ビルド成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
