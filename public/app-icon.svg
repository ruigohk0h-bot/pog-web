<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde9c8"/>
      <stop offset="0.55" stop-color="#f6cf8e"/>
      <stop offset="1" stop-color="#e6a85a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7b56b"/>
      <stop offset="1" stop-color="#cf9445"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffd97a"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="380" cy="132" r="54" fill="url(#sun)"/>

  <!-- sand dune -->
  <path d="M0 360 Q128 312 256 348 T512 344 L512 512 L0 512 Z" fill="url(#sand)"/>
  <path d="M0 360 Q128 312 256 348 T512 344" fill="none" stroke="#f4d9a6" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- hoof prints -->
  <g fill="#b97f37" opacity="0.55">
    <ellipse cx="92" cy="430" rx="13" ry="16"/>
    <ellipse cx="138" cy="452" rx="12" ry="15"/>
    <ellipse cx="186" cy="430" rx="13" ry="16"/>
  </g>

  <!-- bucket -->
  <g transform="translate(360 392)">
    <path d="M-44 0 L44 0 L34 78 L-34 78 Z" fill="#ff6b6b"/>
    <rect x="-46" y="-10" width="92" height="16" rx="8" fill="#ff8585"/>
    <path d="M-40 -8 Q0 -54 40 -8" fill="none" stroke="#ffb3b3" stroke-width="9" stroke-linecap="round"/>
    <rect x="-34" y="22" width="68" height="12" rx="6" fill="#ffd1d1" opacity="0.8"/>
  </g>

  <!-- shovel -->
  <g transform="translate(298 360) rotate(28)">
    <rect x="-7" y="-96" width="14" height="92" rx="7" fill="#5bc0de"/>
    <circle cx="0" cy="-100" r="16" fill="none" stroke="#5bc0de" stroke-width="13"/>
    <path d="M-26 -8 L26 -8 L20 46 Q0 60 -20 46 Z" fill="#39a9cb"/>
  </g>

  <!-- cute pony -->
  <g transform="translate(186 300)">
    <!-- body -->
    <ellipse cx="0" cy="34" rx="86" ry="58" fill="#6b4a2b"/>
    <!-- legs -->
    <rect x="-58" y="74" width="22" height="46" rx="11" fill="#5a3d22"/>
    <rect x="36" y="74" width="22" height="46" rx="11" fill="#5a3d22"/>
    <!-- tail -->
    <path d="M82 16 Q132 22 120 78 Q108 58 78 56 Z" fill="#3f2b18"/>
    <!-- neck + head -->
    <g transform="translate(-58 -34)">
      <path d="M0 60 Q-18 0 22 -20 Q58 -34 64 6 Q66 36 36 52 Z" fill="#6b4a2b"/>
      <!-- muzzle -->
      <ellipse cx="20" cy="-4" rx="34" ry="28" fill="#7a5631"/>
      <ellipse cx="6" cy="2" rx="5" ry="7" fill="#3f2b18"/>
      <!-- eye -->
      <circle cx="34" cy="-20" r="8" fill="#27190d"/>
      <circle cx="37" cy="-23" r="3" fill="#fff"/>
      <!-- ear -->
      <path d="M44 -42 L60 -64 L66 -38 Z" fill="#6b4a2b"/>
      <!-- mane -->
      <path d="M48 -40 Q70 -20 58 18 Q52 -8 38 -22 Z" fill="#3f2b18"/>
    </g>
  </g>
</svg>
